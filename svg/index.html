<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>QR SVG</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="../tokens.css">
  <style>
    html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
    body { overflow: hidden; font-family: var(--font-sans); }

    /* The code fills the shorter side of the viewport; its 4-module quiet
       zone is part of the viewBox. */
    .stage {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: grid;
      place-items: center;
    }
    .stage svg {
      display: block;
      width: min(100vw, 100vh);
      height: min(100vw, 100vh);
      width: min(100vw, 100dvh);
      height: min(100vw, 100dvh);
    }

    .empty {
      box-sizing: border-box;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      padding: min(40px, 7vmin);
      overflow: auto;
    }
    .empty[hidden], .stage[hidden] { display: none; }
    .empty-box {
      box-sizing: border-box;
      min-height: 100%;
      border: 1px dashed var(--dashed);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: min(32px, 6vmin);
      text-align: center;
    }
    .glyph {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      width: 54px;
      height: 54px;
    }
    .glyph .o { border: 2px solid var(--ink); }
    .glyph .a { background: var(--accent); }
    .copy { display: flex; flex-direction: column; gap: 10px; }
    h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
    p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--muted); }
    code {
      background: var(--code-bg);
      padding: 10px 14px;
      font-family: var(--font-mono);
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    a {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 13px;
    }
    a:hover { color: var(--muted); }
    a svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: square; }
  </style>
</head>
<body>
  <div class="stage" id="stage" hidden></div>

  <main class="empty" id="empty" hidden>
    <div class="empty-box">
      <div class="glyph" aria-hidden="true">
        <span class="o"></span><span></span><span class="o"></span>
        <span></span><span></span><span></span>
        <span class="o"></span><span></span><span class="a"></span>
      </div>
      <div class="copy">
        <h1 id="empty-title">Nothing to encode</h1>
        <p id="empty-body">Add text to the link and the code appears here.</p>
      </div>
      <code>/svg/?s=512&amp;t=hello</code>
      <a href="../">Make one at qr.kakkoi.dev
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      </a>
    </div>
  </main>

  <script src="../vendor/qrcode.js"></script>
  <script src="../qr.js"></script>
  <script>
    (function () {
      var opts = QR.parse(new URLSearchParams(location.search));
      var empty = document.getElementById('empty');

      if (!opts.text) {
        empty.hidden = false;
        return;
      }

      var code;
      try {
        code = QR.encode(opts.text, opts.ecc);
      } catch (e) {
        document.getElementById('empty-title').textContent = 'Too long to encode';
        document.getElementById('empty-body').textContent = 'Too long for a QR code — shorten the text.';
        empty.hidden = false;
        return;
      }

      var NS = 'http://www.w3.org/2000/svg';
      var dim = code.count + opts.margin * 2;
      var svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '0 0 ' + dim + ' ' + dim);
      svg.setAttribute('shape-rendering', 'crispEdges');
      svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', 'QR code: ' + opts.text);
      if (opts.bg !== 'none') {
        var rect = document.createElementNS(NS, 'rect');
        rect.setAttribute('width', '100%');
        rect.setAttribute('height', '100%');
        rect.setAttribute('fill', '#' + opts.bg);
        svg.appendChild(rect);
      } else {
        document.documentElement.style.background = 'transparent';
        document.body.style.background = 'transparent';
      }
      var path = document.createElementNS(NS, 'path');
      path.setAttribute('d', code.path(opts.margin));
      path.setAttribute('fill', '#' + opts.ink);
      svg.appendChild(path);

      var stage = document.getElementById('stage');
      stage.appendChild(svg);
      stage.hidden = false;
    })();
  </script>
</body>
</html>
